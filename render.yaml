# Render Blueprint for the FastAPI backend (Dashboard → New → Blueprint → pick this repo).
# The frontend deploys separately on Vercel (see README → Deployment).
services:
  - type: web
    name: airbnb-clone-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker: the startup seed must not run concurrently against the same SQLite file.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      # The free tier has no persistent disk: this file starts empty on every boot and is
      # re-created + re-seeded on startup.
      - key: DATABASE_URL
        value: sqlite:///./airbnb.db
      - key: SEED_ON_STARTUP
        value: "true"
      - key: DEBUG
        value: "false"
      # Your Vercel URL(s), comma-separated, e.g. https://airbnb-clone.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional, for Vercel preview deploys, e.g. https://airbnb-clone-.*\.vercel\.app
      - key: CORS_ORIGIN_REGEX
        sync: false
